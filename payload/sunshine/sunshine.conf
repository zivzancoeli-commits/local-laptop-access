# Intel MacBook. A stream session switches the built-in display to a 1x mode
# at the same logical size so VideoToolbox can keep up.

upnp = disabled
origin_web_ui_allowed = lan
address_family = ipv4

lan_encryption_mode = 0
wan_encryption_mode = 1

encoder = videotoolbox
vt_software = disabled
vt_realtime = enabled
vt_coder = cavlc

hevc_mode = 1
av1_mode = 1

# LAN: extra FEC only adds encode/send work and delay.
fec_percentage = 1
# Do not duplicate frames when capture hiccups; that queues latency.
# 0 means "half the client FPS" in this Sunshine build, which stuffed
# stale frames into the pipe after the lid closed. 1 almost never duplicates.
minimum_fps_target = 1
min_threads = 4
qp = 30
max_bitrate = 0
